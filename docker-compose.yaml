version: '3'

services:
  flask-app:
    image: flask_api
    build:
      context: .
      dockerfile: ./pib_api/flask/Dockerfile
    command: "bash -c 'flask --app run db upgrade && flask --app run seed_db && flask --app run run --host 0.0.0.0'"
    networks:
      - pib-network
    ports:
      - "5000:5000"
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/pibdata.db
    volumes:
      - ./pib_api/flask/:/app
      - programs:/root/cerebra_programs
    restart: always
  rosbridge-ws:
    build:
      context: ./ros_packages
      dockerfile: ./rosbridge/Dockerfile
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
    networks:
      - pib-network
    restart: always
    ports:
      - "9090:9090"

  ros-motors:
    image: ros_motors
    build:
      context: .
      dockerfile: ./ros_packages/motors/Dockerfile
    privileged: true
    command: ros2 launch motors launch.py
    profiles:
      - all
      - motors
    networks:
      - pib-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_API_BASE_URL=http://flask-app:5000
      - TINKERFORGE_HOST=host.docker.internal
      - TINKERFORGE_PORT=4223
      - ROBSTRIDE_PORTS=/dev/ttyMotor4
      - ROBSTRIDE_MOTOR_IDS=21,41
      - ROBSTRIDE_MODEL=rs-04
      - ROBSTRIDE_DEFAULT_SPEED=0.06
      - ROBSTRIDE_DEFAULT_ACCEL=0.15
      - ROBSTRIDE_DISABLE_AFTER_MOVE=false
      - ROBSTRIDE_SHORTEST_PATH_IDS=41
      - ROBSTRIDE_CAN_TIMEOUT=40000
      - ROBSTRIDE_KEEPALIVE_SECONDS=0.5
      - ROBSTRIDE_SETTLE_SECONDS=0.75
      - ROBSTRIDE_DISABLE_WAIT_FACTOR=2.0
      - ROBSTRIDE_MIN_DISABLE_SECONDS=2.0
      - ROBSTRIDE_PRIME_POSITION_TARGET=true
      - ROBSTRIDE_PRIME_SETTLE_SECONDS=0.05
      - STS_RECOVERY_ENABLED=true
      - STS_RECOVERY_PORTS=/dev/ttyMotor1,/dev/ttyMotor2,/dev/ttyMotor3
      - STS_RECOVERY_MOTOR_NAMES=thumb_left_opposition,thumb_left_stretch,index_left_stretch,middle_left_stretch,ring_left_stretch,pinky_left_stretch,wrist_left,lower_arm_left_rotation,elbow_left,upper_arm_left_rotation,shoulder_horizontal_left,wrist_right,lower_arm_right_rotation,elbow_right,upper_arm_right_rotation,shoulder_horizontal_right
      - STS_RECOVERY_INTERVAL_SECONDS=2.0
      - STS_RECOVERY_FAILURE_THRESHOLD=2
      - STS_PORT_AUTO_REOPEN_ENABLED=false
      - STS_BUS_REOPEN_COOLDOWN_SECONDS=30.0
      - STS_BUS_REOPEN_DELAY_SECONDS=0.5
      - STS_MULTI_MOTOR_STAGGER_SECONDS=0.75
      - STS_RECOVERY_RETRY_SECONDS=2.0
      - STS_RECOVERY_MAX_ATTEMPTS=3
      - STS_RECOVERY_WINDOW_SECONDS=60.0
      - COLLISION_GUARD_MODE=enforce
      - COLLISION_TRAJECTORY_STEP_DEGREES=0.25
      - COLLISION_RANGE_STEP_DEGREES=1.0
      - WAIT_FOR_DEVICES=/dev/ttyMotor0 /dev/ttyMotor1 /dev/ttyMotor2 /dev/ttyMotor3 /dev/ttyMotor4
      - WAIT_FOR_DEVICES_TIMEOUT=30
    restart: always
    depends_on:
      - rosbridge-ws
      - flask-app
    volumes:
      - /dev/:/dev/
      - ./ros_packages/motors/motors/collision_guard.py:/app/ros2_ws/install/motors/lib/python3.10/site-packages/motors/collision_guard.py:ro
      - ./ros_packages/motors/motors/motor_control.py:/app/ros2_ws/install/motors/lib/python3.10/site-packages/motors/motor_control.py:ro
      - ./ros_packages/motors/pib_motors/pib_motors/bricklet_pin.py:/usr/local/lib/python3.10/dist-packages/pib_motors/bricklet_pin.py:ro
      - ./ros_packages/motors/pib_motors/pib_motors/motor.py:/usr/local/lib/python3.10/dist-packages/pib_motors/motor.py:ro
      - ./ros_packages/motors/config/collision_geometry.json:/app/ros2_ws/motors/config/collision_geometry.json:ro
      - ./setup/system_pose.py:/app/system_pose.py:ro
      
  ros-programs:
    image: ros_programs
    build:
      context: .
      dockerfile: ./ros_packages/programs/Dockerfile
    command: ros2 launch programs launch.py
    profiles:
      - all
      - programs
    environment:
      - FLASK_API_BASE_URL=http://flask-app:5000
      - TINKERFORGE_HOST=host.docker.internal
      - TINKERFORGE_PORT=4223
      - PYTHON_BINARY=/usr/bin/python3
      - PROGRAM_DIR=/ros2_ws/cerebra_programs
      - VOICE_ASSISTANT_DIR=/app/ros2_ws/voice_assistant
    volumes:
      - programs:/ros2_ws/cerebra_programs
    restart: always
    networks:
      - pib-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rosbridge-ws
      - flask-app

  ros-display:
    image: ros-display
    privileged: true
    build:
      context: .
      dockerfile: ./ros_packages/display/Dockerfile
    profiles:
      - all
      - display
    volumes:
      # this is a socket that is used by the x-windowing-system
      # for cmmunication betweem clients and servers on the same
      # machine. By mounting the socket of the docker-host, the 
      # display-node uses the x-server running on the host for
      # graphics-related communication
      - /tmp/.X11-unix:/tmp/.X11-unix 
    environment:
      - STATIC_IMAGE_DIR=/app/ros2_ws/display/static_images
      - DISPLAY=:0.0
    command: ros2 launch display launch.py
    restart: always
    networks:
      - pib-network

  ros-audio-io:
    image: ros-audio-io
    build:
     context: .
     dockerfile: ./ros_packages/ros_audio_io/Dockerfile
    command: ros2 launch ros_audio_io launch.py
    profiles:
      - all
      - ros_audio_io
      - voice_assistant
    networks:
      - pib-network
    env_file:
      - ros-audio.env
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb1
    privileged: true
    volumes:
      - /media/dyan/project/projects/voice/:/data/voice
      - /dev/snd:/dev/snd
      - /dev/dsp:/dev/dsp
      - /etc/machine-id:/etc/machine-id
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      - /home/pib/.config/pulse/cookie:/root/.config/pulse/cookie
    restart: always
    depends_on:
      - rosbridge-ws

volumes:
  programs:

networks:
  pib-network:
    driver: bridge
